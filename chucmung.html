<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="%23ff69b4" stroke="%23e91e63" stroke-width="1"/></svg>') 10 10, auto;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, 
                rgba(248, 205, 213, 0.9) 0%,
                rgba(255, 200, 221, 0.8) 20%,
                rgba(255, 175, 204, 0.7) 40%,
                rgba(252, 173, 188, 0.8) 60%,
                rgba(248, 174, 188, 0.9) 80%,
                rgba(255, 200, 221, 0.8) 100% 
            );
            background-size: 400% 400%;
            animation: dreamyPinkFlow 12s ease-in-out infinite;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        @keyframes dreamyPinkFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .svg-container {
            width: 80%;
            max-width: 600px;
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #rose-t { display: block; }
        #theSvg { display: none; }

        text {
            fill: black; 
            font-family: consolas;
            font-size: 9px;
            font-weight: bold;
        }

        .fireworks {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .firework {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: fireworkExplode 2s ease-out infinite;
        }

        @keyframes fireworkExplode {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(10); opacity: 0.6; }
            100% { transform: scale(20); opacity: 0; }
        }

        .heart-images-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .heart-img-scroll {
            position: absolute;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
            animation: scrollLeftToRight linear forwards;
            opacity: 0.9;
            border-radius: 15px;
        }

        @keyframes scrollLeftToRight {
            0% { transform: translateX(-250px) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateX(-180px) scale(1); }
            90% { opacity: 1; transform: translateX(calc(100vw + 50px)) scale(1); }
            100% { transform: translateX(calc(100vw + 150px)) scale(0.5); opacity: 0; }
        }

        @media (max-width: 768px) {
            .heart-img-scroll { width: 120px !important; height: 120px !important; }
        }
    </style>
</head>

<body>

    <audio id="myAudio"></audio>

    <div class="fireworks" id="fireworks"></div>
    <div class="heart-images-container" id="heartImagesContainer"></div>

    <svg id="rose-t" class="svg-container" viewBox="0 0 512 512">
        <path class="leafOne" d="M124.302,328.222c-2.466-2.901-5.036-5.334-7.648-7.212c-1.884-1.354-4.49-1.207-6.201,0.36 c-32.608,29.866-18.892,84.017,24.01,94.752c2.251,0.563,4.612-0.548,5.624-2.636c0.407-0.841,0.781-1.732,1.138-2.648 C111.438,394.378,103.302,355.204,124.302,328.222z" />
        <path class="stickLine" d="M337.625,212.314c2.37-3.44,1.501-8.149-1.939-10.519c-3.44-2.369-8.15-1.501-10.519,1.939 c-19.493,28.304-43.492,60.076-72.147,92.853l-2.542-30.875c-0.343-4.163-4-7.261-8.158-6.917c-4.163,0.343-7.26,3.995-6.917,8.158 l3.721,45.196C172.176,385.546,93.558,449.444,4.053,496.37c-3.699,1.94-5.127,6.512-3.187,10.211 c1.352,2.579,3.983,4.054,6.705,4.054c1.183,0,2.385-0.279,3.505-0.867c63.84-33.47,124.784-76.962,181.511-129.479 c5.891-2.031,32.15-10.225,68.671-8.819c4.156,0.167,7.689-3.09,7.85-7.266c0.161-4.174-3.092-7.689-7.267-7.849 c-18.678-0.721-34.824,0.89-47.384,3.036C259.688,314.785,301.126,265.31,337.625,212.314z" />
        <path class="leafTwo" d="M329.58,413.715c30.055,1.827,57.188-13.413,71.993-37.343c1.738-2.81,1.253-6.495-1.142-8.771 c-13.04-12.394-37.78-21.675-66.625-23.428s-54.527,4.464-68.972,15.187c-2.653,1.969-3.581,5.568-2.196,8.568 C274.438,393.475,299.525,411.888,329.58,413.715z" />
        <path class="leafS1" d="M370.677,231.945c-8.984-2.411-17.479-7.138-24.516-14.205c-5.085-5.106-8.742-10.981-11.143-17.242 c-6.645,0.902-13.554,0.516-20.475-1.491c-9.578-2.778-17.805-7.959-24.234-14.68c-12.216,1.01-22.611,4.593-28.859,9.642 c-1.416,1.145-1.839,3.149-0.999,4.772c7.157,13.821,21.478,23.41,38.131,23.745c11.548,0.232,22.109-4.035,30.031-11.178 c-2.461,10.379-1.13,21.692,4.621,31.709c8.293,14.445,23.583,22.401,39.142,22.039c1.826-0.042,3.382-1.376,3.705-3.168 C377.509,253.982,375.658,243.144,370.677,231.945z" />
        <path class="rose1" d="M508.212,99.848c-2.666-4.581-27.324-44.843-71.558-48.206c-4.268-0.223-8.58-0.164-12.816,0.176 l-1.148,0.092l0.471,1.051c7.005,15.648,9.002,31.447,7.106,48.307l0.877,0.04c11.782,0.538,23.679,3.513,35.362,8.841l0.367,0.168 l0.355-0.188c10.841-5.728,22.445-6.783,35.477-3.225C506.927,108.058,510.397,103.599,508.212,99.848z" />
        <path class="rose2" d="M418.642,40.96c-24.19-37.169-71.346-39.455-76.643-39.593c-4.34-0.114-6.582,5.071-3.543,8.22 c9.38,9.721,14.029,20.406,14.212,32.665l0.005,0.402l0.324,0.242c13.637,10.194,23.714,22.558,29.944,36.731 c4.198,10.201,6.37,19.468,7.545,29.411l0.996-0.402c8.962-3.617,18.525-6.008,28.405-7.105c3.688-0.322,7.481-0.397,11.274-0.223 l0.762,0.035C434.378,79.498,430.171,59.623,418.642,40.96z " />
        <path class="rose3" d="M343.8,146.676c13.018-17.726,29.06-30.524,47.682-38.039l0.576-0.232 c-1.161-9.857-3.49-19.395-7.611-29.408c-20.694-47.084-74.317-58.577-80.363-59.731c-4.853-0.927-8.31,4.471-5.489,8.546 c21.533,31.149,7.895,59.383-14.633,90.009l0.071,0.029c-16.953,26.497-7.863,61.237,18.513,76.865 c3.932,2.33,8.219,4.207,12.806,5.537c6.757,1.959,13.752,2.469,20.787,1.514l1.017-0.138l-0.367-0.959 C330.327,183.817,333.08,162.625,343.8,146.676z" />
        <path class="rose4" d="M510.726,141.7c-3.917-4.747-39.75-46.26-91.009-41.792c-21.664,2.405-52.653,12.308-77.277,45.856 c-13.392,19.922-16.495,52.272,4.132,72.986c3.371,3.385,7.075,6.243,11.008,8.573c26.325,15.597,61.186,6.961,76.309-20.683 l0.077,0.062c15.307-34.399,34.961-59.933,71.9-56.082C510.802,151.136,513.867,145.507,510.726,141.7z" />
    </svg>

    <svg id="theSvg" class="svg-container" viewBox="-120 -30 240 180">
        <defs>
            <path id="shape" d="M0, 21.054 C0, 21.054 24.618, -15.165 60.750, 8.554 C93.249, 29.888 57.749, 96.888 0, 117.388 C-57.749, 96.888 -93.249, 29.888 -60.750, 8.554 C-24.618, -15.165 -0, 21.054 -0, 21.054z" />
            <path id="partialPath" />
        </defs>
        <text dy="-2">
            <textPath style="font-family: fantasy;" xlink:href="#partialPath" startOffset="12">
                🌹Happy Birthday Day 🌹................................🌹From With Love 29/3!🌹
            </textPath>
        </text>
        <foreignObject x="-70" y="20" width="140" height="85">
            <div xmlns="http://www.w3.org/1999/xhtml" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;">
                <span id="heart-text" style="color: black; font-size: 8px; font-weight: bold; font-family: 'Dancing Script', cursive; line-height: 1.4; word-wrap: break-word; text-shadow: 1px 1px 2px rgba(255,255,255,0.8);"></span>
            </div>
        </foreignObject>
    </svg>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('step') === 'wishes') {
            window.addEventListener('DOMContentLoaded', () => {
                nextStage();
            });
        }

        const playlist = ["nhac1.mp3", "nhac2.mp3", "nhac3.mp3"];
        let currentSongIndex = 0;
        const audioPlayer = document.getElementById("myAudio");

        audioPlayer.addEventListener('ended', function() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            audioPlayer.src = playlist[currentSongIndex];
            audioPlayer.play();
        });

        function playMusic() {
            audioPlayer.src = playlist[currentSongIndex];
            audioPlayer.play().catch(e => console.log("Music ready"));
        }

        const heartImages = [
            "e17cdf9b-717a-46a4-b10a-d1ab6cd896cf.jpg", "4d1e62b7-4ae6-4b2a-a3b2-c90b362377f1.jpg",
            "04902444-bb9a-47d9-a25f-9bf194eeb3b3.jpg", "1c0fee8f-73dc-4a2d-acfe-1b6af7e74393.jpg",
            "a1b6f57c-f88b-4f5e-821c-150baea967a1.jpg", "bd4b2b39-d6c8-437e-83ce-585f9cad8a71.jpg",
            "32ecf8fd-bb46-49b1-ac59-ab3f8feb24aa.jpg", "nogn.jpg", "gaixenh.jpg"
        ];

        function createFireworks() {
            const fireworks = document.getElementById('fireworks');
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#feca57', '#ff9ff3'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    fireworks.appendChild(firework);
                    setTimeout(() => firework.remove(), 2000);
                }, i * 300);
            }
        }

        function createScrollingImage() {
            const container = document.getElementById('heartImagesContainer');
            if(!container) return;
            const img = document.createElement('img');
            img.src = heartImages[Math.floor(Math.random() * heartImages.length)];
            img.className = 'heart-img-scroll';
            img.style.top = (Math.random() * 80) + 'vh';
            const duration = 6 + Math.random() * 4;
            img.style.animationDuration = duration + 's';
            const size = 150 + Math.random() * 100;
            img.style.width = size + 'px';
            img.style.height = (size * 1.3) + 'px';
            container.appendChild(img);
            setTimeout(() => img.remove(), duration * 1000);
        }

        const textLetterP = "chúc anh tuổi 18 thật ý nghĩa đi đường cẩn thận về nhà an toàn anh nhé💗";
        let indexTextContent = 0;

        function startTypingInHeart() {
            const el = document.getElementById('heart-text');
            if (el && indexTextContent < textLetterP.length) {
                el.textContent += textLetterP[indexTextContent++];
                setTimeout(startTypingInHeart, 50);
            }
        }

        function nextStage() {
            playMusic();
            document.getElementById("rose-t").style.display = "none";
            document.getElementById("theSvg").style.display = "block";
            
            // ÉP HIỆN NGUYÊN TRÁI TIM NGAY LẬP TỨC
            const path = document.getElementById("shape");
            const partial = document.getElementById("partialPath");
            partial.setAttribute("d", path.getAttribute("d")); // Hiện đầy đủ hình dáng trái tim
            
            setTimeout(startTypingInHeart, 500);
            createFireworks();
            setInterval(createFireworks, 6000);
            setInterval(createScrollingImage, 800);
        }

        if (params.get('step') !== 'wishes') {
            anime({
                targets: 'path',
                strokeDashoffset: [anime.setDashoffset, 0],
                easing: 'easeInOutCubic',
                duration: 3000,
                complete: function() {
                    document.querySelectorAll('.leafOne, .leafTwo, .leafS1').forEach(el => el.setAttribute("fill", "#9CDD05"));
                    document.querySelector('.stickLine').setAttribute("fill", "#83AA2E");
                    document.querySelectorAll('.rose1, .rose3').forEach(el => el.setAttribute("fill", "#F37D79"));
                    document.querySelectorAll('.rose2, .rose4').forEach(el => el.setAttribute("fill", "#D86666"));
                    setTimeout(nextStage, 1000);
                }
            });
        }
    </script>
</body>
</html>
