<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/2.0.2/anime.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="%23ff69b4" stroke="%23e91e63" stroke-width="1"/></svg>') 10 10, auto;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, 
                rgba(248, 205, 213, 0.9) 0%,
                rgba(255, 200, 221, 0.8) 20%,
                rgba(255, 175, 204, 0.7) 40%,
                rgba(252, 173, 188, 0.8) 60%,
                rgba(248, 174, 188, 0.9) 80%,
                rgba(255, 200, 221, 0.8) 100% 
            );
            background-size: 400% 400%;
            animation: dreamyPinkFlow 12s ease-in-out infinite;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        @keyframes dreamyPinkFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Vị trí chung cho các SVG (Hoa và Tim) */
        .svg-container {
            width: 80%;
            max-width: 600px;
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #rose-t {
            display: block;
        }

        #theSvg {
            display: none;
        }

        /* SVG text path (Viền trái tim) */
        text {
            fill: black; 
            font-family: consolas;
            font-size: 9px;
            font-weight: bold;
        }

        /* HIỆU ỨNG PHÁO HOA & ẢNH TRƯỢT NỀN */
        .fireworks {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .firework {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: fireworkExplode 2s ease-out infinite;
        }

        @keyframes fireworkExplode {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(10); opacity: 0.6; }
            100% { transform: scale(20); opacity: 0; }
        }

        .heart-images-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .heart-img-scroll {
            position: absolute;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
            animation: scrollLeftToRight linear forwards;
            opacity: 0.9;
            border-radius: 15px;
        }

        @keyframes scrollLeftToRight {
            0% { transform: translateX(-250px) scale(0.5); opacity: 0; }
            10% { opacity: 1; transform: translateX(-180px) scale(1); }
            90% { opacity: 1; transform: translateX(calc(100vw + 50px)) scale(1); }
            100% { transform: translateX(calc(100vw + 150px)) scale(0.5); opacity: 0; }
        }

        @media (max-width: 768px) {
            .heart-img-scroll { width: 120px !important; height: 120px !important; }
        }
        @media (max-width: 480px) {
            .heart-img-scroll { width: 100px !important; height: 100px !important; }
        }
    </style>
</head>

    <script>
        // --- 1. SCRIPT PHÁT NHẠC (PLAYLIST) ---
        const playlist = ["nhac1.mp3", "nhac2.mp3", "nhac3.mp3"];
        let currentSongIndex = 0;
        const audioPlayer = document.getElementById("myAudio");

        // Tự động chuyển bài khi hết bài hiện tại
        audioPlayer.addEventListener('ended', function() {
            currentSongIndex++;
            if (currentSongIndex >= playlist.length) {
                currentSongIndex = 0; // Quay lại bài đầu tiên nếu đã phát hết
            }
            audioPlayer.src = playlist[currentSongIndex];
            audioPlayer.play().catch(e => console.log(e));
        });

        function playMusic() {
            audioPlayer.src = playlist[currentSongIndex];
            audioPlayer.play().catch(error => {
                console.log("Trình duyệt chặn autoplay, vui lòng click vào màn hình để phát nhạc.");
            });
        }

        // Bắt sự kiện click vào màn hình để đảm bảo nhạc được phép phát nếu autoplay bị chặn
        document.body.addEventListener('click', function() {
            if (audioPlayer.paused && document.getElementById("theSvg").style.display === "block") {
                audioPlayer.play();
            }
        }, { once: true });


        // --- 2. SCRIPT VẼ TRÁI TIM THEO VIỀN ---
        let rid = null;
        const SVG_NS = "http://www.w3.org/2000/svg";
        const pathlength = document.getElementById("shape").getTotalLength();
        let t = 0;
        let lengthAtT = pathlength * t;
        let d = document.getElementById("shape").getAttribute("d");
        let n = d.match(/C/gi).length;
        let pos = 0;

        class subPath {
            constructor(d) {
                this.d = d;
                this.get_PointsRy();
                this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
                this.measurePath();
                this.get_M_Point();
                this.get_lastCubicBezier();
            }
            get_PointsRy() {
                this.pointsRy = [];
                let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v);
                temp.map(item => { this.pointsRy.push(parseFloat(item)); });
            }
            measurePath() {
                let path = document.createElementNS(SVG_NS, "path");
                path.setAttributeNS(null, "d", this.d);
                this.pathLength = path.getTotalLength();
            }
            get_M_Point() {
                if (this.previous) {
                    let p = this.previous.pointsRy;
                    let l = p.length;
                    this.M_point = [p[l - 2], p[l - 1]];
                } else {
                    let p = this.pointsRy;
                    this.M_point = [p[0], p[1]];
                }
            }
            get_lastCubicBezier() {
                let lastIndexOfC = this.d.lastIndexOf("C");
                let temp = this.d.substring(lastIndexOfC + 1).split(/[\s,]/).filter(v => v);
                let _temp = [];
                temp.map(item => { _temp.push(parseFloat(item)); });
                this.lastCubicBezier = [this.M_point];
                for (let i = 0; i < _temp.length; i += 2) {
                    this.lastCubicBezier.push(_temp.slice(i, i + 2));
                }
            }
        }

        let subpaths = [];
        for (let i = 0; i < n; i++) {
            let newpos = d.indexOf("C", pos + 1);
            if (i > 0) {
                let sPath = new subPath(d.substring(0, newpos));
                subpaths.push(sPath);
            }
            pos = newpos;
        }
        subpaths.push(new subPath(d));

        let index;
        for (index = 0; index < subpaths.length; index++) {
            if (subpaths[index].pathLength >= lengthAtT) break;
        }

        function get_T(t, index) {
            let T;
            lengthAtT = pathlength * t;
            if (index > 0) {
                T = (lengthAtT - subpaths[index].previous.pathLength) /
                    (subpaths[index].pathLength - subpaths[index].previous.pathLength);
            } else {
                T = lengthAtT / subpaths[index].pathLength;
            }
            return T;
        }

        function getBezierPoints(t, points) {
            let helperPoints = [];
            for (let i = 1; i < 4; i++) {
                let p = lerp(points[i - 1], points[i], t);
                helperPoints.push(p);
            }
            helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
            helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));
            helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));
            let firstBezier = [points[0], helperPoints[0], helperPoints[3], helperPoints[5]];
            return firstBezier;
        }

        function lerp(A, B, t) {
            return [(B[0] - A[0]) * t + A[0], (B[1] - A[1]) * t + A[1]];
        }

        function drawCBezier(points, path, index) {
            let d;
            if (index > 0) {
                d = subpaths[index].previous.d;
            } else {
                d = `M${points[0][0]},${points[0][1]} C`;
            }
            for (let i = 1; i < 4; i++) {
                d += ` ${points[i][0]},${points[i][1]} `;
            }
            document.getElementById("partialPath").setAttributeNS(null, "d", d);
        }

        // --- 3. SCRIPT GÕ CHỮ TRỰC TIẾP Ở GIỮA TRÁI TIM ---
        const textLetterP = "Hôm nay là ngày 29/03. Xin gửi lời chúc tới người tớ yêu thương nhất. Luôn vui vẻ, luôn hạnh phúc và luôn may mắn trong cuộc sống, ngày càng xinh đẹp. Xin gửi tất cả lời chúc tốt đẹp đến với cậu. Love You💗";
        let indexTextContent = 0;
        let textContainer = document.getElementById('heart-text');

        function startTypingInHeart() {
            if (indexTextContent < textLetterP.length) {
                textContainer.textContent += textLetterP[indexTextContent];
                indexTextContent++;
                setTimeout(startTypingInHeart, 50);
            }
        }

        // --- 4. SCRIPT HIỆU ỨNG NỀN VÀ CẬP NHẬT ẢNH ---
        // Đã thêm các hình ảnh mới của bạn vào mảng này
        const heartImages = [
            "thuyquynh.jpg", "Tulinh.jpg", "nhaminh.jpg", "MinhAnh.jpg",
            "minhhang2.jpg", "myxuan.jpg", "xuantrang3.jpg", "thanhvan.jpg",
            "tramanh.jpg", "xuantrang2.jpg", "xuantrang.jpg", "hieungan2.jpg",
            "hieungan.jpg", "phuckhang.jpg", "xuanphuong.jpg", "bchau.jpg",
            "minhhang.jpg", "baochausuy.jpg", "cohanh.jpg", "baochau.jpg",
            "gianhu2000.jpg", "gianghi900.jpg", "nhaminh20.jpg", "nhavy100.jpg", 
            "gianghi20.jpg", "nhavy20.jpg", "baongoc.jpg"
        ];

        function createFireworks() {
            const fireworks = document.getElementById('fireworks');
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
            for (let i = 0; i < 13; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.animationDelay = Math.random() * 2 + 's';
                    firework.style.boxShadow = `0 0 20px ${firework.style.backgroundColor}`;
                    fireworks.appendChild(firework);
                    setTimeout(() => firework.remove(), 2000);
                }, i * 350);
            }
        }

        function createRectangleImage() {
            const container = document.getElementById('heartImagesContainer');
            const img = document.createElement('img');
            img.src = heartImages[Math.floor(Math.random() * heartImages.length)];
            img.className = 'heart-img-scroll';
            img.style.top = (Math.random() * 90) + 'vh';
            
            const duration = 5 + Math.random() * 3;
            img.style.animationDuration = duration + 's';
            
            const widths = [177, 170, 220, 188, 210, 240, 225, 193];
            const heights = [300, 310, 150, 290, 210, 180, 380, 330];
            const sizeIndex = Math.floor(Math.random() * widths.length);
            img.style.width = widths[sizeIndex] + 'px';
            img.style.height = heights[sizeIndex] + 'px';
            
            container.appendChild(img);
            setTimeout(() => { if (img.parentNode) img.remove(); }, duration * 1000);
        }

        function createScrollingHeartImage() {
            const container = document.getElementById('heartImagesContainer');
            const img = document.createElement('img');
            img.src = heartImages[Math.floor(Math.random() * heartImages.length)];
            img.className = 'heart-img-scroll';
            img.style.top = (Math.random() * 90) + 'vh';
            
            const duration = 6 + Math.random() * 3;
            img.style.animationDuration = duration + 's';
            
            const sizes = [210, 240, 220, 230, 250, 210, 215, 235];
            const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
            img.style.width = randomSize + 'px';
            img.style.height = randomSize + 'px';
            
            container.appendChild(img);
            setTimeout(() => { if (img.parentNode) img.remove(); }, duration * 1000);
        }

        function startBackgroundEffects() {
            createFireworks();
            setInterval(createFireworks, 5000);

            for (let i = 0; i < 13; i++) setTimeout(createRectangleImage, i * 240);
            setInterval(createRectangleImage, 550);

            for (let i = 0; i < 12; i++) setTimeout(createScrollingHeartImage, i * 2570);
            setInterval(createScrollingHeartImage, 300);
        }


        // --- 5. HÀM CHUYỂN CẢNH KÍCH HOẠT TẤT CẢ ---
        function nextStage() {
            // Phát playlist nhạc
            playMusic();

            // Ẩn hoa, hiện tim
            document.getElementById("rose-t").style.display = "none";
            document.getElementById("theSvg").style.display = "block";

            // Bắt đầu vẽ viền trái tim
            rid = window.requestAnimationFrame(function Typing() {
                rid = window.requestAnimationFrame(Typing);
                if (t >= 1) {
                    window.cancelAnimationFrame(rid);
                    rid = null;
                } else {
                    t += 0.0025;
                }
                lengthAtT = pathlength * t;
                for (index = 0; index < subpaths.length; index++) {
                    if (subpaths[index].pathLength >= lengthAtT) break;
                }
                let T = get_T(t, index);
                let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);
                drawCBezier(newPoints, document.getElementById("partialPath"), index);
            });

            // Bắt đầu gõ chữ ở giữa trái tim
            setTimeout(startTypingInHeart, 500);

            // Bắt đầu chạy hình nền & pháo hoa
            startBackgroundEffects();
        }

        // --- 6. CHẠY ANIME HOA HỒNG BAN ĐẦU ---
        var leafOne = document.querySelector('.leafOne');
        var stickLine = document.querySelector('.stickLine');
        var leafTwo = document.querySelector('.leafTwo');
        var leafS1 = document.querySelector('.leafS1');
        var rose1 = document.querySelector('.rose1');
        var rose2 = document.querySelector('.rose2');
        var rose3 = document.querySelector('.rose3');
        var rose4 = document.querySelector('.rose4');

        anime({
            targets: [leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4],
            strokeDashoffset: [anime.setDashoffset, 0],
            easing: 'easeInOutCubic',
            duration: 4000,
            begin: function (anim) {
                let paths = [leafOne, stickLine, leafTwo, leafS1, rose1, rose2, rose3, rose4];
                paths.forEach(p => { p.setAttribute("stroke", "black"); p.setAttribute("fill", "none"); });
            },
            complete: function (anim) {
                leafOne.setAttribute("fill", "#9CDD05"); leafOne.setAttribute("stroke", "none");
                leafTwo.setAttribute("fill", "#9CDD05"); leafTwo.setAttribute("stroke", "none");
                stickLine.setAttribute("fill", "#83AA2E"); stickLine.setAttribute("stroke", "none");
                leafS1.setAttribute("fill", "#9CDD05"); leafS1.setAttribute("stroke", "none");
                rose1.setAttribute("fill", "#F37D79"); rose1.setAttribute("stroke", "none");
                rose2.setAttribute("fill", "#D86666"); rose2.setAttribute("stroke", "none");
                rose3.setAttribute("fill", "#F37D79"); rose3.setAttribute("stroke", "none");
                rose4.setAttribute("fill", "#D86666"); rose4.setAttribute("stroke", "none");

                // Kích hoạt bước tiếp theo (hiện trái tim, gõ chữ, nền, bật nhạc)
                setTimeout(nextStage, 1500); 
            },
            autoplay: true,
        });
    </script>
</body>
</html>
